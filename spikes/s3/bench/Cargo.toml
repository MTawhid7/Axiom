[package]
name = "s3-bench"
description = "Spike S3: benchmarks and probes for the root stacks (S3-Q1), rooting traffic (S3-Q2), dispatch (S3-Q3), layout (S3-Q4) and write barriers (S3-Q5), with S1's code as the in-session baseline. #![forbid(unsafe_code)]."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The `s3-count` binary: instruction and root-operation counts (S3-Q2).
count = ["s3-vm/count"]
# The explicit-tail-call technique, on nightly (S3-Q3's reference point).
nightly-tail = ["s3-vm/nightly-tail"]

[dependencies]
s3-gc.workspace = true
s3-vm.workspace = true
s1-scenarios.workspace = true
s1-b-gc.workspace = true
s1-b-dom.workspace = true
s1-bench = { path = "../../s1/bench" }

[[bin]]
name = "s3-count"
required-features = ["count"]

# `cargo bench -p s3-bench`. The same suites are reachable as `s3-probe bench`,
# whose binary has a stable path for scripts and profilers.
[[bench]]
name = "s3"
harness = false

[lints]
workspace = true
