# cargo-deny's configuration for the engine's workspace (the dependency
# policy's DP16, with DP13 and DP17), run by tools/check.sh's checkpoint tier
# with cargo-deny 0.20.2. The spikes' workspace is exempt (DP23).

[graph]
targets = ["aarch64-apple-darwin"]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# DP16: RustSec's advisories, its unmaintained and unsound notices included.
[advisories]
# The database is cloned under target/, not into ~/.cargo.
db-path = "target/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
yanked = "deny"
# An ignored advisory needs its assessment in the register (DP20).
ignore = []

# DP17: licenses compatible with Axiom's "MIT OR Apache-2.0"; MPL-2.0's
# copyleft stays with its own files. No GPL, LGPL, AGPL, SSPL, or any non-OSI
# or unidentified license.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.93
exceptions = []

[licenses.private]
# Axiom's own crates aren't published; their license is the workspace's.
ignore = true

# DP16: one version of each crate in a shipped executable, as Servo denies,
# and no second implementation of what a decided dependency covers.
[bans]
multiple-versions = "deny"
wildcards = "deny"
# Axiom's own crates depend on each other by path, without a version; they
# are unpublished (publish = false), so the path is the pin.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    { crate = "openssl", reason = "TLS is rustls (NW6); a second TLS stack" },
    { crate = "openssl-sys", reason = "TLS is rustls (NW6); C in any process that links it" },
    { crate = "native-tls", reason = "TLS is rustls with the system verifying certificates (NW6)" },
    { crate = "ring", reason = "rustls' provider is aws-lc-rs (NW6); a second implementation of cryptography (DP3)" },
    { crate = "httparse", reason = "graded ub-risk-4 (DP8); HTTP/1.1 parsing is Axiom's own (NW3)" },
    { crate = "tokio", reason = "no async runtime: protocols are state machines on their thread's one wait (ES12, EL1)" },
]
skip = []
skip-tree = []

# DP13: crates.io only.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
