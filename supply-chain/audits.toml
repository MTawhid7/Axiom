[[audits.arrayvec]]
who = "Claude (Opus 5.5), for Axiom's owner"
criteria = ["ub-risk-2", "does-not-implement-crypto"]
delta = "0.7.6 -> 0.7.8"
notes = """
Axiom's M1-CP2 audit, docs/research/vello-cpu-audit.md §4.2: the 125-line diff read
with its context. A safe spare_capacity_mut, lifetime elision, a 16-bit LenUint, and a
mem::forget in extend's zero-sized branch that removes a double drop. Carries Google's
ub-risk-2 at 0.7.6 forward.
"""

[[audits.bytemuck]]
who = "Claude (Opus 5.5), for Axiom's owner"
criteria = ["ub-risk-2", "does-not-implement-crypto"]
delta = "1.22.0 -> 1.25.2"
notes = """
Axiom's M1-CP2 audit, docs/research/vello-cpu-audit.md §4.2: the diff read ignoring
whitespace (344 lines; 1.22.0's CRLF endings inflate it to 8,216). New unsafe impls:
NoUninit for arrays of char, bool and NonZero integers; AnyBitPattern for
[MaybeUninit<T>; N]; ZeroableInOption for function pointers of every ABI; the nightly
Simd impls without LaneCount, whose packed layout was checked on nightly-2026-10-21.
All hold. Carries Google's ub-risk-2 chain through 1.22.0 forward.
"""

[[audits.cfg-if]]
who = "Claude (Opus 5.5), for Axiom's owner"
criteria = ["ub-risk-0", "does-not-implement-crypto"]
version = "1.0.5"
notes = "No unsafe code: a macro_rules! crate (docs/research/encoding-rs-audit.md §6.4, finding 9)."

[[audits.color]]
who = "Claude (Opus 5.5), for Axiom's owner"
criteria = ["ub-risk-1", "does-not-implement-crypto"]
version = "0.3.3"
notes = """
Axiom's M1-CP2 audit, docs/research/vello-cpu-audit.md §4.4: the crate's only unsafe is
22 bytemuck impls, each commented and checked against its type: repr(transparent) color
wrappers, repr(C) Rgba8 types, and repr(u8) enums whose discriminants run from 0
without a gap.
"""

[[audits.encoding_rs]]
who = "Claude (Opus 5.5), for Axiom's owner"
criteria = ["ub-risk-3", "does-not-implement-crypto"]
version = "0.8.42"
notes = """
Axiom's audits, docs/research/encoding-rs-audit.md: the grade at Round 1 (2026-10-21),
and at M1-CP2 (2026-10-23) every compiled unsafe block, with feature alloc on
aarch64-apple-darwin, named with its invariant (all hold); a differential test of
four million buffers against std. ub-risk-3 for sparse safety documentation and the
asm! barrier in minimally_init, reached only from six String and Vec conveniences,
which Axiom's TX3 interface doesn't call. The owner approves with the dependency.
"""

