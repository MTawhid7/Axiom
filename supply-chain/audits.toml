notes = "A geometry library: points, vectors, sizes, rectangles and transforms; no cryptography."

[[audits.euclid]]
who = "Claude (Opus 5.5), for Axiom's owner"
criteria = "ub-risk-1"
delta = "0.22.11 -> 0.22.14"
notes = """
Axiom's M1-CP2 audit, docs/research/vello-cpu-audit.md §4.2: the diff's only new unsafe
is Zeroable and Pod for the repr(C) ScaleOffset2D (four T fields and a PhantomData),
under the bytemuck feature, the pattern Google reviewed at 0.22.11. Holds.
"""

[[audits.fearless_simd]]
who = "Claude (Opus 5.5), for Axiom's owner"
criteria = ["ub-risk-2", "does-not-implement-crypto"]
version = "0.7.0"
notes = """
Axiom's M1-CP2 audit, docs/research/vello-cpu-audit.md §4.5: the aarch64 NEON build
with feature std read in full (27 blocks, the SimdPod trait and its 42 impls). The x86
and WebAssembly backends were not read. The hand-written transmute machinery is
documented; the generated NEON blocks are uncommented but load and store exactly the
fixed-size arrays they are given.
"""

[[audits.foldhash]]
who = "Claude (Opus 5.5), for Axiom's owner"
criteria = ["ub-risk-2", "does-not-implement-crypto"]
version = "0.2.0"
notes = """
Axiom's M1-CP2 audit, docs/research/vello-cpu-audit.md §4.3: all ten sites. The global
seed's spin lock is unchanged from the 0.1.x that Google graded ub-risk-2; the new
unaligned loads in hash_bytes_long are each bounded by a length check. Not
cryptographic, as its README says.
"""

