[[audits.hashbrown]]
who = "Claude (Opus 5.5), for Axiom's owner"
criteria = ["ub-risk-2", "does-not-implement-crypto"]
version = "0.17.1"
notes = """
Axiom's M1-CP2 audit, docs/research/vello-cpu-audit.md §4.6: every site compiled on
aarch64 with feature default-hasher (224 blocks, 102 other sites), read with its
invariants; no defect found. Six probes of the paths vello_cpu reaches and of the
panic paths pass Miri under Stacked Borrows and Tree Borrows, and AddressSanitizer on
the NEON group that Miri can't reach. Internal safe functions with unstated
preconditions (ctrl_slice, Bucket::as_ptr) keep it from ub-risk-1.
"""

