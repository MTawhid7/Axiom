# Arbor workspace.
#
# Phase Zero, Step 2b: only validation spikes live here (spikes/, throwaway).
# Engine crates will live under crates/ once the architecture is approved;
# the lints, profiles and toolchain pin below are meant to carry over.

[workspace]
resolver = "3"
members = ["spikes/s1/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
s1-scenarios = { path = "spikes/s1/scenarios" }

[workspace.lints.rust]
# `unsafe_code` is set per crate root, with #![forbid] by default and #![deny] for
# allowlisted crates (see tools/unsafe-policy.txt and evaluation §15.3).
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Unsafe hygiene (evaluation §15.3, rule 3).
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# Pedantic lints that add noise without value for this codebase.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Release with line tables, so `samply` can attribute inlined frames.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
