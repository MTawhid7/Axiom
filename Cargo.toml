# Axiom's engine workspace.
#
# Milestone 1, authorized by the owner on 2026-10-23 (MA10). Every engine crate
# lives in crates/, one directory per package, executables included. The crate
# map, tools/crate-map.toml, gives each one its layer, processes, group,
# allowed Axiom dependencies, `unsafe` status and panic class, and
# tools/check-dependencies.py checks them on every commit (the crate
# architecture, docs/architecture/crates.md). The spikes are a workspace of
# their own in spikes/, with their own lock (ADR-0022 D12); fuzz/ will be the
# third, when its first target lands.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
# Axiom's license, chosen by the owner at Step 5's Gate B (OQ-21): LICENSE-MIT,
# LICENSE-APACHE.
license = "MIT OR Apache-2.0"

# Every dependency is declared here once, and members inherit it with
# `workspace = true` (ES24). Axiom's own crates are listed by path; adding an
# edge between them also edits the crate map (CR2). A third-party crate needs
# its register entry and grade first (DP6, DP8), and its justification beside
# it. There is none yet.
[workspace.dependencies]
trace = { path = "crates/trace" }

[workspace.lints.rust]
# `unsafe_code` is set per crate root, with #![forbid] by default and #![deny] for
# allowlisted crates (see tools/unsafe-policy.txt and evaluation §15.3).
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# ES15: every public item is documented; each crate's `//!` is its charter.
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Unsafe hygiene (evaluation §15.3, rule 3).
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# Pedantic lints that add noise without value for this codebase.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# The engineering standards' §15, each an error under `-D warnings`:
# ES4, modules with submodules are directories with a mod.rs;
self_named_module_files = "warn"
# ES6, Axiom's enums are matched exhaustively, so a new variant breaks every
# place that must handle it;
wildcard_enum_match_arm = "warn"
# ES9, a panic is a bug: no unwrap outside tests (clippy.toml), no todo!;
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
# ES14, nothing prints: records go through `trace`;
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
# ES18, a lint is suppressed only with #[expect(lint, reason = "…")].
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# RV1-16 (MA7; ES9): every executable aborts on a panic. Tests keep unwinding,
# which their harness needs.
[profile.release]
panic = "abort"

# Release with line tables, so `samply` can attribute inlined frames.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
